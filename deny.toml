# cargo-deny configuration — license allowlist, advisory & ban rules.
# Source: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[licenses]
# Permissive + weak-copyleft licenses we accept.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "OpenSSL",
    # webpki-roots@1.0.7+ ships the Mozilla CA bundle under CDLA-Permissive-2.0
    # (the Linux Foundation's Community Data License Agreement). It allows
    # unrestricted use, modification, and distribution of the data, so it sits
    # comfortably with the rest of the permissive allowlist. Pulled in via
    # reqwest → hyper-rustls.
    "CDLA-Permissive-2.0",
    # BSL-1.0 (Boost Software License 1.0) — OSI- and FSF-approved, fully
    # permissive (no attribution required for binaries). Pulled in transitively
    # by the macOS GUI stack only: error-code → clipboard-win → arboard →
    # egui-winit → eframe. Unavoidable if we use eframe on macOS.
    "BSL-1.0",
    # OFL-1.1 (SIL Open Font License 1.1) — covers the default UI fonts bundled
    # by epaint_default_fonts → epaint → egui → eframe. A standard, permissive
    # font license; the fonts are embedded data, not linked code.
    "OFL-1.1",
]
confidence-threshold = 0.8

# epaint_default_fonts declares `(MIT OR Apache-2.0) AND OFL-1.1 AND
# Ubuntu-font-1.0` — the Ubuntu Font Licence covering eframe's default font set.
# Same permissive font license as before the eframe 0.34 upgrade; only the
# identifier changed, from the non-SPDX `LicenseRef-UFL-1.0` to the now-standard
# SPDX id `Ubuntu-font-1.0`. Kept as a crate-scoped exception rather than a
# blanket `allow` entry so it cannot silently apply to any other dependency.
exceptions = [
    { allow = ["Ubuntu-font-1.0"], crate = "epaint_default_fonts" },
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[advisories]
# Yanked crates stay a warning (the pre-DISK-0066 setting). DISK-0066 (R6-17)
# briefly relaxed this to "allow" to silence yanked `spin` 0.9.8; that was a
# policy relaxation, not a remediation, and has been reverted. `spin` is now
# pinned to the unyanked 0.9.9 in Cargo.lock, so the tree is yanked-free and
# this rule fires on nothing.
yanked = "warn"

# Empty by design. Every advisory that previously appeared here was closed by
# an actual dependency upgrade rather than a suppression — see
# `.cargo/audit.toml` for the full remediation record:
#   RUSTSEC-2026-0194/0195 (quick-xml DoS)   → wayland-scanner 0.31.11 / quick-xml 0.41
#   RUSTSEC-2026-0192      (ttf-parser)      → eframe 0.35 (epaint dropped ab_glyph for skrifa)
#   RUSTSEC-2023-0071      (rsa Marvin)      → not in cargo-deny's feature graph at all
#                                              (sqlx-mysql is never enabled); suppressing it
#                                              here made cargo-deny emit `advisory-not-detected`.
#   RUSTSEC-2025-0134      (rustls-pemfile)  → removed from the tree by the tonic 0.13 upgrade.
# Add an entry only when no upgrade, replacement or feature-gate exists, and
# always with a dated rationale plus a tracking backlog item.
ignore = []

[sources]
unknown-registry = "warn"
unknown-git      = "warn"
