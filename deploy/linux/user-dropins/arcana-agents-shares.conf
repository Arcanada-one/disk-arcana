# DISK-0070: version-controlled source for the arcana-agents user drop-in.
#
# Installed as:
#   ~/.config/systemd/user/disk-arcana-server.service.d/arcana-agents-shares.conf
#
# Why this file exists: on arcana-agents (the canon Datarim KB host) the server
# runs as a *user* unit under `dev`, and its share configuration lived only in a
# hand-made drop-in on the host — no source anywhere in the repo, so the
# configuration of the canon KB host was not reproducible from code. That
# drop-in declared `hermes-artefacts` alone, which silently unserved
# `datarim-kb`: SyncService still served it out of DISK_SYNC_ROOT, but the
# share_index watcher covers only declared roots, so nothing was indexed and
# clients pulled nothing while both ends reported success.
#
# Rule this file encodes: list EVERY share the host serves, including the one
# that lives at DISK_SYNC_ROOT. Omitting one is silent — see the startup
# warning emitted by `sync_root_is_unwatched()`.
#
# DISK_SYNC_ROOT on this host is /home/dev/arcanada/datarim (set in the unit
# itself as %h/arcanada/datarim), so `datarim-kb` points at the same path.

[Service]
Environment=DISK_SHARE_ROOTS=datarim-kb:/home/dev/arcanada/datarim,hermes-artefacts:/var/lib/disk-arcana/shares/hermes-artefacts
Environment=DISK_REGISTER_NODE_MODE=enrolled
