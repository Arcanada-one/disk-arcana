# DISK-0098: canon KB on arcana-devs — datarim-kb only.
#
# Installed as:
#   ~/.config/systemd/user/disk-arcana-server.service.d/devs-kb-shares.conf
#
# Canon path per ADR-0001 / AGENT-0116: /home/dev/arcanada/datarim on DEVS mesh
# 100.106.230.125:9543. Hermes stays on arcana-agents — not declared here.
#
# x-disk-expected-sync-root: /home/dev/arcanada/datarim

[Service]
Environment=DISK_SHARE_ROOTS=datarim-kb:/home/dev/arcanada/datarim
Environment=DISK_REGISTER_NODE_MODE=enrolled
