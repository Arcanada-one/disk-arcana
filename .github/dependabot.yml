version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    # One grouped PR at a time keeps the open-PR count bounded (backlog <= 3).
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - rust
    # Major bumps need a human decision (dependabot-auto-merge skips them) and
    # were closed repeatedly in the 2026-11-11 backlog sweep; do not reopen them.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/plugins/obsidian"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    # Major bumps need a human decision (dependabot-auto-merge skips them) and
    # were closed repeatedly in the 2026-11-11 backlog sweep; do not reopen them.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # Transitive security fixes need the lockfile refreshed, not package.json
    # edited, so indirect updates must be allowed or scheduled runs simply fail.
    allow:
      - dependency-type: "all"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
