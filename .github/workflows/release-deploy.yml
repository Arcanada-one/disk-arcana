name: Release + Deploy

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target (build-only publishes an artifact and deploys nowhere)"
        required: true
        default: "build-only"
        type: choice
        options:
          # DISK-0071: hosts outside the two deploy targets (e.g. arcana-agents,
          # which runs a user-scope unit and cannot be reached by deploy-dev)
          # still need a binary built from a given commit. Before this option the
          # only way to get one was target=dev, which also deployed to
          # arcana-devs — a side effect nobody asked for when all you need is the
          # artifact.
          - build-only
          - stage-probe
          - stage
          - prod

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BINARY_NAME: disk-arcana-server
  BUILD_TARGET: x86_64-unknown-linux-gnu

jobs:
  # INFRA-0370: actionless proof on the restricted staging runner group. The
  # probe-only target cannot reach any build or delivery job in this workflow.
  stage-readiness:
    name: Dedicated staging runner readiness
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.target == 'stage-probe'
    environment: staging
    runs-on:
      group: disk-arcana-stage
      labels: [self-hosted, Linux, X64, disk-arcana-stage]
    permissions: {}
    timeout-minutes: 10
    steps:
      - name: Exact main source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_REPOSITORY" == Arcanada-one/disk-arcana ]]
          [[ "$GITHUB_WORKFLOW_REF" == Arcanada-one/disk-arcana/.github/workflows/release-deploy.yml@refs/heads/main ]]
          sha_pattern='^[0-9a-f]{40}$'
          [[ "${GITHUB_SHA:-}" =~ $sha_pattern ]]
          [[ "${GITHUB_WORKFLOW_SHA:-}" =~ $sha_pattern ]]
          [[ "${GITHUB_SHA:-}" == "${GITHUB_WORKFLOW_SHA:-}" ]]

      - name: Read-only readiness verdict
        shell: bash
        run: |
          set -euo pipefail

          bool_command() {
            if "$@" >/dev/null 2>&1; then printf true; else printf false; fi
          }

          subid_count() {
            local file="$1"
            awk -F: -v user="$(id -un)" '
              $1 == user && $2 ~ /^[0-9]+$/ && $3 ~ /^[0-9]+$/ {total += $3}
              END {print total + 0}
            ' "$file" 2>/dev/null
          }

          assert_exact_sudo_policy() {
            local -a sudo_specs=()
            mapfile -t sudo_specs < <(awk '
              / may run the following commands on .*:$/ {in_specs=1; next}
              !in_specs {next}
              {
                spec=$0
                sub(/^[[:space:]]+/, "", spec)
                sub(/[[:space:]]+$/, "", spec)
                if (spec !~ /^\([^)]*\)([[:space:]]|$)/) next
                gsub(/[[:space:]]+/, " ", spec)
                gsub(/\([[:space:]]+/, "(", spec)
                gsub(/[[:space:]]+\)/, ")", spec)
                sub(/[[:space:]]*:[[:space:]]*/, ": ", spec)
                print spec
              }
            ')
            [[ "${#sudo_specs[@]}" -eq 1 ]]
            [[ "${sudo_specs[0]}" == '(root) NOPASSWD: /usr/local/sbin/disk-arcana-deploy-broker --deploy *' ]]
          }

          assert_active_runner_binding() {
            local unit="$1" cgroup_file="$2"
            [[ "$(systemctl is-active "$unit" 2>/dev/null)" == active ]]
            awk -F: -v expected="/system.slice/$unit" '
              {
                path=$3
                if (path == expected || index(path, expected "/") == 1) found=1
              }
              END {exit found ? 0 : 1}
            ' "$cgroup_file"
          }

          assert_fresh_main() {
            local expected_sha="$1"
            local workflow_sha="$2"
            local sha_pattern='^[0-9a-f]{40}$'
            local readback remote_sha remote_ref
            [[ "$expected_sha" =~ $sha_pattern && "$workflow_sha" =~ $sha_pattern && \
              "$expected_sha" == "$workflow_sha" ]] || {
              printf 'fresh-main=invalid-input\n' >&2
              return 1
            }
            readback="$(
              cd /
              /usr/bin/timeout --signal=KILL 20s \
              /usr/bin/env \
                -u GIT_DIR \
                -u GIT_WORK_TREE \
                -u GIT_COMMON_DIR \
                -u GIT_CONFIG_PARAMETERS \
                -u GIT_SSL_NO_VERIFY \
                -u GIT_SSL_CAINFO \
                -u GIT_SSL_CAPATH \
                -u CURL_CA_BUNDLE \
                -u SSL_CERT_FILE \
                -u SSL_CERT_DIR \
                -u GIT_TRACE \
                -u GIT_TRACE2 \
                -u GIT_TRACE2_EVENT \
                -u GIT_TRACE2_PERF \
                -u GIT_TRACE_PACKET \
                -u GIT_TRACE_CURL \
                -u GIT_TRACE_CURL_NO_DATA \
                -u GIT_TRACE_SETUP \
                -u GIT_TRACE_PERFORMANCE \
                -u GIT_TRACE_REDACT \
                -u GIT_TRACE_SHALLOW \
                -u GIT_TRACE_FSMONITOR \
                -u GIT_TRACE_PACK_ACCESS \
                -u GIT_CURL_VERBOSE \
                -u GIT_EXEC_PATH \
                GIT_CONFIG_NOSYSTEM=1 \
                GIT_CONFIG_SYSTEM=/dev/null \
                GIT_CONFIG_GLOBAL=/dev/null \
                GIT_CONFIG_COUNT=0 \
                GIT_TERMINAL_PROMPT=0 \
                GIT_ASKPASS=/bin/false \
                SSH_ASKPASS=/bin/false \
                /usr/bin/git \
                  -c credential.helper= \
                  -c core.askPass=/bin/false \
                  -c http.sslVerify=true \
                  -c http.followRedirects=false \
                  ls-remote --quiet --exit-code --refs \
                https://github.com/Arcanada-one/disk-arcana.git refs/heads/main 2>/dev/null
            )" || {
              printf 'fresh-main=query-failed\n' >&2
              return 1
            }
            [[ -n "$readback" && "$readback" != *$'\n'* && "$readback" == *$'\t'* ]] || {
              printf 'fresh-main=malformed-readback\n' >&2
              return 1
            }
            remote_sha="${readback%%$'\t'*}"
            remote_ref="${readback#*$'\t'}"
            [[ "$remote_sha" =~ $sha_pattern && "$remote_ref" == refs/heads/main ]] || {
              printf 'fresh-main=malformed-readback\n' >&2
              return 1
            }
            [[ "$remote_sha" == "$expected_sha" ]] || {
              printf 'fresh-main=stale\n' >&2
              return 1
            }
          }

          [[ "$(id -u)" != 0 ]]
          [[ " $(id -Gn) " == *" disk-arcana-deploy "* ]]

          rootless_userns=false
          if command -v unshare >/dev/null 2>&1; then
            rootless_userns="$(bool_command unshare --user --map-root-user true)"
          fi
          subuid_count="$(subid_count /etc/subuid)"
          subgid_count="$(subid_count /etc/subgid)"
          user_systemd="$(bool_command systemctl --user show-environment)"
          linger="$(loginctl show-user "$(id -u)" -p Linger --value 2>/dev/null || printf unknown)"
          podman="$(bool_command command -v podman)"
          docker_socket_writable="$(bool_command test -w /var/run/docker.sock)"
          mapfile -t runner_units < <(systemctl list-units --type=service --all \
            'actions.runner.*' --plain --no-legend --no-pager 2>/dev/null | awk '{print $1}')
          mapfile -t installed_runner_units < <(systemctl list-unit-files --type=service \
            'actions.runner.*' --no-legend --no-pager 2>/dev/null | awk '{print $1}')

          [[ "$rootless_userns" == true ]]
          (( subuid_count >= 65536 ))
          (( subgid_count >= 65536 ))
          [[ "$user_systemd" == true ]]
          [[ "$linger" == yes ]]
          [[ "$podman" == true ]]
          [[ "$docker_socket_writable" == false ]]
          [[ "${#runner_units[@]}" -eq 1 ]]
          [[ "${runner_units[0]}" == actions.runner.*."${RUNNER_NAME}".service ]]
          assert_active_runner_binding "${runner_units[0]}" /proc/self/cgroup
          [[ "${#installed_runner_units[@]}" -eq 1 ]]
          [[ "${installed_runner_units[0]}" == "${runner_units[0]}" ]]

          LC_ALL=C sudo -n -l 2>/dev/null | assert_exact_sudo_policy

          [[ -f /etc/systemd/system/disk-arcana-server.service ]]
          [[ "$(systemctl is-active disk-arcana-server 2>/dev/null)" == active ]]
          [[ "$(systemctl show disk-arcana-server -p UnitFileState --value 2>/dev/null)" == enabled ]]
          [[ "$(systemctl show disk-arcana-server -p Restart --value 2>/dev/null)" == on-failure ]]
          [[ "$(systemctl show disk-arcana-server -p StartLimitIntervalUSec --value 2>/dev/null)" == 2min ]]
          [[ "$(systemctl show disk-arcana-server -p StartLimitBurst --value 2>/dev/null)" == 5 ]]
          curl --fail --silent --show-error --max-time 10 -o /dev/null http://127.0.0.1:9446/health

          assert_fresh_main "$GITHUB_SHA" "$GITHUB_WORKFLOW_SHA"
          printf 'readiness=ok active_runner_units=%s installed_runner_units=%s sudo_specs=1\n' \
            "${#runner_units[@]}" "${#installed_runner_units[@]}"
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Build a release binary for Linux x86_64 using cross.
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build (x86_64-unknown-linux-gnu)
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.target != 'stage-probe'
    # `cross` drives the build through a container, so this job needs Docker
    # access — but `cargo install cross` compiles ON THE HOST first, so the
    # runner also needs a working C toolchain. The `docker` label alone does
    # not imply one: three runners carry it (arcana-ci-general, arcana-db,
    # arcana-dbs) and only ci-general has `cc`. A build-only dispatch landed on
    # arcana-dbs and died with `linker \`cc\` not found` while installing cross,
    # while the identical workflow had passed minutes earlier purely because
    # the scheduler happened to pick ci-general. Pin the label so the outcome
    # does not depend on which runner is free.
    runs-on: [self-hosted, Linux, X64, ci-general]
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      artifact_digest: ${{ steps.artifact.outputs.artifact-digest }}
      manifest_sha: ${{ steps.bundle.outputs.manifest_sha }}
      build_commit: ${{ steps.bundle.outputs.build_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable 2026-07-30
        with:
          targets: ${{ env.BUILD_TARGET }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1

      - name: Ensure protoc is available
        # The self-hosted pool is heterogeneous: requiring the `docker` label
        # (needed by `cross`) moves this job onto runners that have no
        # preinstalled protoc, where a bare `protoc --version` dies with exit
        # 127 before anything compiles. Same rootless fetch ci.yml already uses;
        # no-op when protoc is present.
        run: |
          set -euo pipefail
          if command -v protoc >/dev/null 2>&1; then
            protoc --version
            exit 0
          fi
          PROTOC_VERSION=25.3
          PROTOC_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/protoc.XXXXXX")
          curl -sSL -o "$PROTOC_DIR/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          python3 -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' \
            "$PROTOC_DIR/protoc.zip" "$PROTOC_DIR"
          chmod +x "$PROTOC_DIR/bin/protoc"
          echo "$PROTOC_DIR/bin" >> "$GITHUB_PATH"
          "$PROTOC_DIR/bin/protoc" --version

      - name: Install cross
        run: cargo install cross --locked --quiet

      - name: Build release binary
        run: cross build --release --target ${{ env.BUILD_TARGET }} --bin ${{ env.BINARY_NAME }}

      - name: Set artifact metadata
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME:-workflow-dispatch}"
          # Sanitize ref name for artifact naming: branch refs (e.g.
          # feat/disk-0058-offline-ca) contain '/', which actions/upload-artifact
          # rejects. Replace any path separator with '-'.
          TAG="${TAG//\//-}"
          NAME="${{ env.BINARY_NAME }}-${TAG}-${{ env.BUILD_TARGET }}"
          echo "artifact_name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Assemble manifest-bound deployment bundle
        id: bundle
        run: |
          set -euo pipefail
          BUNDLE="${RUNNER_TEMP}/disk-deploy-bundle"
          [[ ! -e "$BUNDLE" ]] || {
            echo "::error::deployment bundle path already exists"
            exit 1
          }
          install -d -m 0755 "$BUNDLE"
          install -m 0755 \
            "target/${{ env.BUILD_TARGET }}/release/${{ env.BINARY_NAME }}" \
            "$BUNDLE/disk-arcana-server"
          install -m 0644 deploy/linux/disk-arcana-server.service \
            "$BUNDLE/disk-arcana-server.service"
          install -m 0755 deploy/linux/deploy-server.sh "$BUNDLE/deploy-server.sh"
          install -m 0755 deploy/linux/deploy-server-broker.sh \
            "$BUNDLE/deploy-server-broker.sh"
          install -m 0755 deploy/linux/provision-deploy-broker.sh \
            "$BUNDLE/provision-deploy-broker.sh"
          install -m 0440 deploy/linux/disk-arcana-deploy.sudoers \
            "$BUNDLE/disk-arcana-deploy.sudoers"
          install -m 0755 deploy/linux/install.sh "$BUNDLE/install.sh"
          printf '%s\n' "$GITHUB_SHA" >"$BUNDLE/commit"
          bash deploy/linux/validate-deploy-bundle.sh create \
            --root "$BUNDLE" --commit "$GITHUB_SHA"
          bash deploy/linux/validate-deploy-bundle.sh verify \
            --root "$BUNDLE" --expected-commit "$GITHUB_SHA"
          echo "manifest_sha=$(sha256sum "$BUNDLE/manifest.sha256" | awk '{print $1}')" >>"$GITHUB_OUTPUT"
          echo "build_commit=$GITHUB_SHA" >>"$GITHUB_OUTPUT"

      - name: Upload artifact
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ runner.temp }}/disk-deploy-bundle
          retention-days: 7

  attach-linux-release:
    name: Attach Linux server to GitHub Release
    if: >-
      startsWith(github.ref, 'refs/tags/') &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.target != 'stage-probe')
    needs: build
    runs-on: [self-hosted, Linux, X64]
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/disk-deploy-bundle
      - name: Fresh exact-main release gate
        env:
          BUILT_SHA: ${{ needs.build.outputs.build_commit }}
        run: bash scripts/require-fresh-main.sh "$BUILT_SHA"
      - name: Attach exact bundled binary
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          files: ${{ runner.temp }}/disk-deploy-bundle/disk-arcana-server
          fail_on_unmatched_files: true

  # ──────────────────────────────────────────────────────────────────────────
  # 1b. Build Windows client portable zip on tag push (GitHub-hosted).
  #     Server binary stays Linux/self-hosted above; this job ships disk.exe.
  # ──────────────────────────────────────────────────────────────────────────
  build-windows-client:
    name: Build Windows client (portable zip)
    if: >-
      startsWith(github.ref, 'refs/tags/') &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.target != 'stage-probe')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Install protoc
        shell: pwsh
        run: |
          if (-not (Get-Command protoc -ErrorAction SilentlyContinue)) {
            choco install protoc -y --no-progress
          }

      - name: Build disk CLI release
        run: cargo build --release -p disk-cli --target x86_64-pc-windows-msvc

      - name: Smoke test
        shell: pwsh
        run: ./scripts/test-windows-smoke.ps1 -Binary target/x86_64-pc-windows-msvc/release/disk.exe

      - name: Bundle portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $ver = "${{ github.ref_name }}"
          ./scripts/bundle-windows.ps1 -Binary target/x86_64-pc-windows-msvc/release/disk.exe -OutDir dist -Version $ver

      - name: Fresh exact-main release gate
        shell: bash
        env:
          BUILT_SHA: ${{ github.sha }}
        run: bash scripts/require-fresh-main.sh "$BUILT_SHA"

      - name: Attach Windows zip to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          files: dist/disk-arcana-windows-x86_64.zip
          fail_on_unmatched_files: true

  # ──────────────────────────────────────────────────────────────────────────
  # 1c. Build Linux client binary on tag (DISK-0010 install.sh assets).
  # ──────────────────────────────────────────────────────────────────────────
  build-linux-client:
    name: Build Linux client (disk)
    if: >-
      startsWith(github.ref, 'refs/tags/') &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.target != 'stage-probe')
    # Also uses `cross`; same host-toolchain requirement as `build` above —
    # pinned to ci-general for the same reason (see the note on that job).
    runs-on: [self-hosted, Linux, X64, ci-general]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: disk-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            asset: disk-linux-aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable 2026-07-30
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - name: Ensure protoc is available
        # The self-hosted pool is heterogeneous: requiring the `docker` label
        # (needed by `cross`) moves this job onto runners that have no
        # preinstalled protoc, where a bare `protoc --version` dies with exit
        # 127 before anything compiles. Same rootless fetch ci.yml already uses;
        # no-op when protoc is present.
        run: |
          set -euo pipefail
          if command -v protoc >/dev/null 2>&1; then
            protoc --version
            exit 0
          fi
          PROTOC_VERSION=25.3
          PROTOC_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/protoc.XXXXXX")
          curl -sSL -o "$PROTOC_DIR/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          python3 -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' \
            "$PROTOC_DIR/protoc.zip" "$PROTOC_DIR"
          chmod +x "$PROTOC_DIR/bin/protoc"
          echo "$PROTOC_DIR/bin" >> "$GITHUB_PATH"
          "$PROTOC_DIR/bin/protoc" --version
      - name: Install cross
        run: cargo install cross --locked --quiet
      - name: Build disk CLI
        run: cross build --release -p disk-cli --bin disk --target ${{ matrix.target }}
      - name: Stage release asset
        run: |
          cp "target/${{ matrix.target }}/release/disk" "${{ matrix.asset }}"
          chmod +x "${{ matrix.asset }}"
      - name: Fresh exact-main release gate
        env:
          BUILT_SHA: ${{ github.sha }}
        run: bash scripts/require-fresh-main.sh "$BUILT_SHA"
      - name: Attach client binary to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          files: ${{ matrix.asset }}
          fail_on_unmatched_files: true

  # ──────────────────────────────────────────────────────────────────────────
  # 1d. Build + sign macOS client binaries on tag (DISK-0010 install.sh assets).
  #     Requires GitHub Secrets (see docs/runbooks/DISK-RB-013-macos-cli-release-signing.md).
  #     Uses GitHub-hosted macos-14 (same pattern as build-windows-client).
  # ──────────────────────────────────────────────────────────────────────────
  build-macos-client:
    name: Build macOS client (signed disk)
    if: >-
      startsWith(github.ref, 'refs/tags/') &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.target != 'stage-probe')
    runs-on: macos-14
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            asset: disk-macos-arm64
          - target: x86_64-apple-darwin
            asset: disk-macos-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install protoc
        run: brew install protobuf

      - name: Import Developer ID certificate
        env:
          DISK_MACOS_CERT_P12: ${{ secrets.DISK_MACOS_CERT_P12 }}
          DISK_MACOS_CERT_PASSWORD: ${{ secrets.DISK_MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${DISK_MACOS_CERT_P12}" ]]; then
            echo "::error::DISK_MACOS_CERT_P12 secret is not configured — see docs/runbooks/DISK-RB-013-macos-cli-release-signing.md"
            exit 1
          fi
          echo "$DISK_MACOS_CERT_P12" | base64 --decode > /tmp/disk-signing.p12
          security create-keychain -p actions disk-sign.keychain
          security default-keychain -s disk-sign.keychain
          security unlock-keychain -p actions disk-sign.keychain
          security import /tmp/disk-signing.p12 -k disk-sign.keychain \
            -P "$DISK_MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions disk-sign.keychain

      - name: Build disk CLI
        run: cargo build --release -p disk-cli --bin disk --target ${{ matrix.target }}

      - name: Sign and notarize
        env:
          DISK_SIGN_IDENTITY: ${{ secrets.DISK_SIGN_IDENTITY }}
          DISK_NOTARY_KEYCHAIN_PROFILE: ${{ secrets.DISK_NOTARY_KEYCHAIN_PROFILE }}
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/disk"
          if [[ -z "${DISK_SIGN_IDENTITY}" ]]; then
            echo "::error::DISK_SIGN_IDENTITY secret is not configured"
            exit 1
          fi
          if [[ -n "${DISK_NOTARY_KEYCHAIN_PROFILE}" ]]; then
            xcrun notarytool store-credentials "$DISK_NOTARY_KEYCHAIN_PROFILE" \
              --apple-id "${{ secrets.DISK_NOTARY_APPLE_ID }}" \
              --team-id "${{ secrets.DISK_NOTARY_TEAM_ID }}" \
              --password "${{ secrets.DISK_NOTARY_PASSWORD }}"
          fi
          bash scripts/sign-macos-cli.sh "$BIN"

      - name: Stage release asset
        run: |
          cp "target/${{ matrix.target }}/release/disk" "${{ matrix.asset }}"
          chmod +x "${{ matrix.asset }}"

      - name: Fresh exact-main release gate
        env:
          BUILT_SHA: ${{ github.sha }}
        run: bash scripts/require-fresh-main.sh "$BUILT_SHA"
      - name: Attach macOS client to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          files: ${{ matrix.asset }}
          fail_on_unmatched_files: true

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Deploy through the dedicated Disk staging runner. A production
  #    dispatch must prove this exact build artifact on staging first.
  #    A tag push builds + attaches the release artifact but does NOT auto-deploy
  #    anywhere: deploys (dev or prod) are always an explicit operator action so
  #    a tag never lands code on a host on its own. The unique runner label is
  #    part of the least-privilege boundary and must not be shared.
  # ──────────────────────────────────────────────────────────────────────────
  deploy-stage:
    name: Deploy (dedicated staging)
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      (github.event.inputs.target == 'stage' || github.event.inputs.target == 'prod')
    runs-on:
      group: disk-arcana-stage
      labels: [self-hosted, Linux, X64, disk-arcana-stage]
    environment: staging
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/disk-deploy-bundle

      - name: Deploy exact bundle through installed broker
        env:
          EXPECTED_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
          EXPECTED_MANIFEST_SHA: ${{ needs.build.outputs.manifest_sha }}
          EXPECTED_BUILD_COMMIT: ${{ needs.build.outputs.build_commit }}
        run: |
          set -euo pipefail
          BUNDLE="${RUNNER_TEMP}/disk-deploy-bundle"
          [[ "$(id -u)" -ne 0 ]]
          printf 'runner_user=%s runner_name=%s\n' "$(id -un)" "$RUNNER_NAME"
          systemctl is-active --quiet disk-arcana-server
          [[ "$(systemctl show disk-arcana-server -p UnitFileState --value)" == enabled ]]
          [[ "$EXPECTED_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_MANIFEST_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_BUILD_COMMIT" == "$GITHUB_SHA" ]]
          [[ "$(sha256sum "$BUNDLE/manifest.sha256" | awk '{print $1}')" == "$EXPECTED_MANIFEST_SHA" ]]
          [[ "$(<"$BUNDLE/commit")" == "$EXPECTED_BUILD_COMMIT" ]]
          printf 'artifact_id=%s artifact_digest=%s manifest_sha=%s commit=%s\n' \
            "$EXPECTED_ARTIFACT_ID" "$EXPECTED_ARTIFACT_DIGEST" \
            "$EXPECTED_MANIFEST_SHA" "$EXPECTED_BUILD_COMMIT"
          bash scripts/require-fresh-main.sh "$EXPECTED_BUILD_COMMIT"
          authorization_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-staging"
          sudo -n /usr/local/sbin/disk-arcana-deploy-broker --deploy \
            "$BUNDLE" "$authorization_id"
          sha256sum /usr/local/bin/disk-arcana-server \
            /etc/systemd/system/disk-arcana-server.service
          [[ "$(systemctl show disk-arcana-server -p UnitFileState --value)" == enabled ]]
          systemctl show disk-arcana-server \
            -p ActiveState -p UnitFileState -p Restart \
            -p StartLimitIntervalUSec -p StartLimitBurst
          health_body="$(curl --fail --silent --show-error --max-time 10 \
            http://127.0.0.1:9446/health)"
          [[ "$(printf '%s' "$health_body" | tr -d '[:space:]')" == *'"status":"ok"'* ]]
          printf 'health=ok\n'

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Deploy to arcana-prod (hard-gated: only on tag push via explicit
  #    workflow_dispatch target=prod, NOT auto-run on tag).
  #    Operator must manually trigger with target=prod after staging passes.
  # ──────────────────────────────────────────────────────────────────────────
  deploy-prod:
    name: Deploy (arcana-prod) [HARD-GATED]
    needs: [build, deploy-stage]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.target == 'prod'
    runs-on: [self-hosted, Linux, X64, disk-arcana-prod]
    environment: production
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/disk-deploy-bundle

      - name: Deploy staged exact bundle through installed broker
        env:
          EXPECTED_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
          EXPECTED_MANIFEST_SHA: ${{ needs.build.outputs.manifest_sha }}
          EXPECTED_BUILD_COMMIT: ${{ needs.build.outputs.build_commit }}
        run: |
          set -euo pipefail
          BUNDLE="${RUNNER_TEMP}/disk-deploy-bundle"
          [[ "$(id -u)" -ne 0 ]]
          printf 'runner_user=%s runner_name=%s\n' "$(id -un)" "$RUNNER_NAME"
          systemctl is-active --quiet disk-arcana-server
          [[ "$(systemctl show disk-arcana-server -p UnitFileState --value)" == enabled ]]
          [[ "$EXPECTED_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_MANIFEST_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_BUILD_COMMIT" == "$GITHUB_SHA" ]]
          [[ "$(sha256sum "$BUNDLE/manifest.sha256" | awk '{print $1}')" == "$EXPECTED_MANIFEST_SHA" ]]
          [[ "$(<"$BUNDLE/commit")" == "$EXPECTED_BUILD_COMMIT" ]]
          printf 'artifact_id=%s artifact_digest=%s manifest_sha=%s commit=%s\n' \
            "$EXPECTED_ARTIFACT_ID" "$EXPECTED_ARTIFACT_DIGEST" \
            "$EXPECTED_MANIFEST_SHA" "$EXPECTED_BUILD_COMMIT"
          bash scripts/require-fresh-main.sh "$EXPECTED_BUILD_COMMIT"
          authorization_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-production"
          sudo -n /usr/local/sbin/disk-arcana-deploy-broker --deploy \
            "$BUNDLE" "$authorization_id"
          sha256sum /usr/local/bin/disk-arcana-server \
            /etc/systemd/system/disk-arcana-server.service
          [[ "$(systemctl show disk-arcana-server -p UnitFileState --value)" == enabled ]]
          systemctl show disk-arcana-server \
            -p ActiveState -p UnitFileState -p Restart \
            -p StartLimitIntervalUSec -p StartLimitBurst
          health_body="$(curl --fail --silent --show-error --max-time 10 \
            http://127.0.0.1:9446/health)"
          [[ "$(printf '%s' "$health_body" | tr -d '[:space:]')" == *'"status":"ok"'* ]]
          printf 'health=ok\n'
