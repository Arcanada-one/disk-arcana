name: Release + Deploy

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target (build-only publishes an artifact and deploys nowhere)"
        required: true
        default: "build-only"
        type: choice
        options:
          # DISK-0071: hosts outside the two deploy targets (e.g. arcana-agents,
          # which runs a user-scope unit and cannot be reached by deploy-dev)
          # still need a binary built from a given commit. Before this option the
          # only way to get one was target=dev, which also deployed to
          # arcana-devs — a side effect nobody asked for when all you need is the
          # artifact.
          - build-only
          - stage
          - prod

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BINARY_NAME: disk-arcana-server
  BUILD_TARGET: x86_64-unknown-linux-gnu

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Build a release binary for Linux x86_64 using cross.
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build (x86_64-unknown-linux-gnu)
    # `cross` drives the build through a container, so this job needs Docker
    # access — but `cargo install cross` compiles ON THE HOST first, so the
    # runner also needs a working C toolchain. The `docker` label alone does
    # not imply one: three runners carry it (arcana-ci-general, arcana-db,
    # arcana-dbs) and only ci-general has `cc`. A build-only dispatch landed on
    # arcana-dbs and died with `linker \`cc\` not found` while installing cross,
    # while the identical workflow had passed minutes earlier purely because
    # the scheduler happened to pick ci-general. Pin the label so the outcome
    # does not depend on which runner is free.
    runs-on: [self-hosted, Linux, X64, ci-general]
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      artifact_digest: ${{ steps.artifact.outputs.artifact-digest }}
      manifest_sha: ${{ steps.bundle.outputs.manifest_sha }}
      build_commit: ${{ steps.bundle.outputs.build_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable 2026-07-30
        with:
          targets: ${{ env.BUILD_TARGET }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1

      - name: Ensure protoc is available
        # The self-hosted pool is heterogeneous: requiring the `docker` label
        # (needed by `cross`) moves this job onto runners that have no
        # preinstalled protoc, where a bare `protoc --version` dies with exit
        # 127 before anything compiles. Same rootless fetch ci.yml already uses;
        # no-op when protoc is present.
        run: |
          set -euo pipefail
          if command -v protoc >/dev/null 2>&1; then
            protoc --version
            exit 0
          fi
          PROTOC_VERSION=25.3
          PROTOC_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/protoc.XXXXXX")
          curl -sSL -o "$PROTOC_DIR/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          python3 -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' \
            "$PROTOC_DIR/protoc.zip" "$PROTOC_DIR"
          chmod +x "$PROTOC_DIR/bin/protoc"
          echo "$PROTOC_DIR/bin" >> "$GITHUB_PATH"
          "$PROTOC_DIR/bin/protoc" --version

      - name: Install cross
        run: cargo install cross --locked --quiet

      - name: Build release binary
        run: cross build --release --target ${{ env.BUILD_TARGET }} --bin ${{ env.BINARY_NAME }}

      - name: Set artifact metadata
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME:-workflow-dispatch}"
          # Sanitize ref name for artifact naming: branch refs (e.g.
          # feat/disk-0058-offline-ca) contain '/', which actions/upload-artifact
          # rejects. Replace any path separator with '-'.
          TAG="${TAG//\//-}"
          NAME="${{ env.BINARY_NAME }}-${TAG}-${{ env.BUILD_TARGET }}"
          echo "artifact_name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Assemble manifest-bound deployment bundle
        id: bundle
        run: |
          set -euo pipefail
          BUNDLE="${RUNNER_TEMP}/disk-deploy-bundle"
          [[ ! -e "$BUNDLE" ]] || {
            echo "::error::deployment bundle path already exists"
            exit 1
          }
          install -d -m 0755 "$BUNDLE"
          install -m 0755 \
            "target/${{ env.BUILD_TARGET }}/release/${{ env.BINARY_NAME }}" \
            "$BUNDLE/disk-arcana-server"
          install -m 0644 deploy/linux/disk-arcana-server.service \
            "$BUNDLE/disk-arcana-server.service"
          install -m 0755 deploy/linux/deploy-server.sh "$BUNDLE/deploy-server.sh"
          install -m 0755 deploy/linux/deploy-server-broker.sh \
            "$BUNDLE/deploy-server-broker.sh"
          install -m 0755 deploy/linux/provision-deploy-broker.sh \
            "$BUNDLE/provision-deploy-broker.sh"
          install -m 0440 deploy/linux/disk-arcana-deploy.sudoers \
            "$BUNDLE/disk-arcana-deploy.sudoers"
          printf '%s\n' "$GITHUB_SHA" >"$BUNDLE/commit"
          bash deploy/linux/validate-deploy-bundle.sh create \
            --root "$BUNDLE" --commit "$GITHUB_SHA"
          bash deploy/linux/validate-deploy-bundle.sh verify \
            --root "$BUNDLE" --expected-commit "$GITHUB_SHA"
          echo "manifest_sha=$(sha256sum "$BUNDLE/manifest.sha256" | awk '{print $1}')" >>"$GITHUB_OUTPUT"
          echo "build_commit=$GITHUB_SHA" >>"$GITHUB_OUTPUT"

      - name: Upload artifact
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ runner.temp }}/disk-deploy-bundle
          retention-days: 7

  attach-linux-release:
    name: Attach Linux server to GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: [self-hosted, Linux, X64]
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/disk-deploy-bundle
      - name: Attach exact bundled binary
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          files: ${{ runner.temp }}/disk-deploy-bundle/disk-arcana-server
          fail_on_unmatched_files: true

  # ──────────────────────────────────────────────────────────────────────────
  # 1b. Build Windows client portable zip on tag push (GitHub-hosted).
  #     Server binary stays Linux/self-hosted above; this job ships disk.exe.
  # ──────────────────────────────────────────────────────────────────────────
  build-windows-client:
    name: Build Windows client (portable zip)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Install protoc
        shell: pwsh
        run: |
          if (-not (Get-Command protoc -ErrorAction SilentlyContinue)) {
            choco install protoc -y --no-progress
          }

      - name: Build disk CLI release
        run: cargo build --release -p disk-cli --target x86_64-pc-windows-msvc

      - name: Smoke test
        shell: pwsh
        run: ./scripts/test-windows-smoke.ps1 -Binary target/x86_64-pc-windows-msvc/release/disk.exe

      - name: Bundle portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $ver = "${{ github.ref_name }}"
          ./scripts/bundle-windows.ps1 -Binary target/x86_64-pc-windows-msvc/release/disk.exe -OutDir dist -Version $ver

      - name: Attach Windows zip to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          files: dist/disk-arcana-windows-x86_64.zip
          fail_on_unmatched_files: true

  # ──────────────────────────────────────────────────────────────────────────
  # 1c. Build Linux client binary on tag (DISK-0010 install.sh assets).
  # ──────────────────────────────────────────────────────────────────────────
  build-linux-client:
    name: Build Linux client (disk)
    if: startsWith(github.ref, 'refs/tags/')
    # Also uses `cross`; same host-toolchain requirement as `build` above —
    # pinned to ci-general for the same reason (see the note on that job).
    runs-on: [self-hosted, Linux, X64, ci-general]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: disk-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            asset: disk-linux-aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable 2026-07-30
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - name: Ensure protoc is available
        # The self-hosted pool is heterogeneous: requiring the `docker` label
        # (needed by `cross`) moves this job onto runners that have no
        # preinstalled protoc, where a bare `protoc --version` dies with exit
        # 127 before anything compiles. Same rootless fetch ci.yml already uses;
        # no-op when protoc is present.
        run: |
          set -euo pipefail
          if command -v protoc >/dev/null 2>&1; then
            protoc --version
            exit 0
          fi
          PROTOC_VERSION=25.3
          PROTOC_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/protoc.XXXXXX")
          curl -sSL -o "$PROTOC_DIR/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          python3 -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' \
            "$PROTOC_DIR/protoc.zip" "$PROTOC_DIR"
          chmod +x "$PROTOC_DIR/bin/protoc"
          echo "$PROTOC_DIR/bin" >> "$GITHUB_PATH"
          "$PROTOC_DIR/bin/protoc" --version
      - name: Install cross
        run: cargo install cross --locked --quiet
      - name: Build disk CLI
        run: cross build --release -p disk-cli --bin disk --target ${{ matrix.target }}
      - name: Stage release asset
        run: |
          cp "target/${{ matrix.target }}/release/disk" "${{ matrix.asset }}"
          chmod +x "${{ matrix.asset }}"
      - name: Attach client binary to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          files: ${{ matrix.asset }}
          fail_on_unmatched_files: true

  # ──────────────────────────────────────────────────────────────────────────
  # 1d. Build + sign macOS client binaries on tag (DISK-0010 install.sh assets).
  #     Requires GitHub Secrets (see docs/runbooks/DISK-RB-013-macos-cli-release-signing.md).
  #     Uses GitHub-hosted macos-14 (same pattern as build-windows-client).
  # ──────────────────────────────────────────────────────────────────────────
  build-macos-client:
    name: Build macOS client (signed disk)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-14
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            asset: disk-macos-arm64
          - target: x86_64-apple-darwin
            asset: disk-macos-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install protoc
        run: brew install protobuf

      - name: Import Developer ID certificate
        env:
          DISK_MACOS_CERT_P12: ${{ secrets.DISK_MACOS_CERT_P12 }}
          DISK_MACOS_CERT_PASSWORD: ${{ secrets.DISK_MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${DISK_MACOS_CERT_P12}" ]]; then
            echo "::error::DISK_MACOS_CERT_P12 secret is not configured — see docs/runbooks/DISK-RB-013-macos-cli-release-signing.md"
            exit 1
          fi
          echo "$DISK_MACOS_CERT_P12" | base64 --decode > /tmp/disk-signing.p12
          security create-keychain -p actions disk-sign.keychain
          security default-keychain -s disk-sign.keychain
          security unlock-keychain -p actions disk-sign.keychain
          security import /tmp/disk-signing.p12 -k disk-sign.keychain \
            -P "$DISK_MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions disk-sign.keychain

      - name: Build disk CLI
        run: cargo build --release -p disk-cli --bin disk --target ${{ matrix.target }}

      - name: Sign and notarize
        env:
          DISK_SIGN_IDENTITY: ${{ secrets.DISK_SIGN_IDENTITY }}
          DISK_NOTARY_KEYCHAIN_PROFILE: ${{ secrets.DISK_NOTARY_KEYCHAIN_PROFILE }}
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/disk"
          if [[ -z "${DISK_SIGN_IDENTITY}" ]]; then
            echo "::error::DISK_SIGN_IDENTITY secret is not configured"
            exit 1
          fi
          if [[ -n "${DISK_NOTARY_KEYCHAIN_PROFILE}" ]]; then
            xcrun notarytool store-credentials "$DISK_NOTARY_KEYCHAIN_PROFILE" \
              --apple-id "${{ secrets.DISK_NOTARY_APPLE_ID }}" \
              --team-id "${{ secrets.DISK_NOTARY_TEAM_ID }}" \
              --password "${{ secrets.DISK_NOTARY_PASSWORD }}"
          fi
          bash scripts/sign-macos-cli.sh "$BIN"

      - name: Stage release asset
        run: |
          cp "target/${{ matrix.target }}/release/disk" "${{ matrix.asset }}"
          chmod +x "${{ matrix.asset }}"

      - name: Attach macOS client to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          files: ${{ matrix.asset }}
          fail_on_unmatched_files: true

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Deploy to arcana-devs for both dev and prod dispatches. A production
  #    dispatch must prove this exact build artifact on staging first.
  #    A tag push builds + attaches the release artifact but does NOT auto-deploy
  #    anywhere: deploys (dev or prod) are always an explicit operator action so
  #    a tag never lands code on a host on its own. (Auto-deploy on tag was also
  #    unreachable — the dev runner carries the canonical `arcana-devs` label.
  # ──────────────────────────────────────────────────────────────────────────
  deploy-stage:
    name: Deploy (arcana-devs)
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.target == 'stage' || github.event.inputs.target == 'prod')
    runs-on: [self-hosted, Linux, X64, arcana-devs]
    environment: dev
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/disk-deploy-bundle

      - name: Deploy exact bundle through installed broker
        env:
          EXPECTED_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
          EXPECTED_MANIFEST_SHA: ${{ needs.build.outputs.manifest_sha }}
          EXPECTED_BUILD_COMMIT: ${{ needs.build.outputs.build_commit }}
        run: |
          set -euo pipefail
          BUNDLE="${RUNNER_TEMP}/disk-deploy-bundle"
          [[ "$EXPECTED_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_MANIFEST_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_BUILD_COMMIT" == "$GITHUB_SHA" ]]
          [[ "$(sha256sum "$BUNDLE/manifest.sha256" | awk '{print $1}')" == "$EXPECTED_MANIFEST_SHA" ]]
          [[ "$(<"$BUNDLE/commit")" == "$EXPECTED_BUILD_COMMIT" ]]
          printf 'artifact_id=%s artifact_digest=%s manifest_sha=%s commit=%s\n' \
            "$EXPECTED_ARTIFACT_ID" "$EXPECTED_ARTIFACT_DIGEST" \
            "$EXPECTED_MANIFEST_SHA" "$EXPECTED_BUILD_COMMIT"
          sudo -n /usr/local/sbin/disk-arcana-deploy-broker --deploy \
            "$BUNDLE" "$EXPECTED_BUILD_COMMIT" "$(hostname)"
          sha256sum /usr/local/bin/disk-arcana-server \
            /etc/systemd/system/disk-arcana-server.service
          systemctl show disk-arcana-server \
            -p ActiveState -p UnitFileState -p Restart \
            -p StartLimitIntervalUSec -p StartLimitBurst
          curl --fail --silent --show-error --max-time 10 \
            http://127.0.0.1:9446/health

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Deploy to arcana-prod (hard-gated: only on tag push via explicit
  #    workflow_dispatch target=prod, NOT auto-run on tag).
  #    Operator must manually trigger with target=prod after staging passes.
  # ──────────────────────────────────────────────────────────────────────────
  deploy-prod:
    name: Deploy (arcana-prod) [HARD-GATED]
    needs: [build, deploy-stage]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'prod'
    runs-on: [self-hosted, Linux, X64, arcana-prod]
    environment: production
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/disk-deploy-bundle

      - name: Deploy staged exact bundle through installed broker
        env:
          EXPECTED_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
          EXPECTED_MANIFEST_SHA: ${{ needs.build.outputs.manifest_sha }}
          EXPECTED_BUILD_COMMIT: ${{ needs.build.outputs.build_commit }}
        run: |
          set -euo pipefail
          BUNDLE="${RUNNER_TEMP}/disk-deploy-bundle"
          [[ "$EXPECTED_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_MANIFEST_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_BUILD_COMMIT" == "$GITHUB_SHA" ]]
          [[ "$(sha256sum "$BUNDLE/manifest.sha256" | awk '{print $1}')" == "$EXPECTED_MANIFEST_SHA" ]]
          [[ "$(<"$BUNDLE/commit")" == "$EXPECTED_BUILD_COMMIT" ]]
          printf 'artifact_id=%s artifact_digest=%s manifest_sha=%s commit=%s\n' \
            "$EXPECTED_ARTIFACT_ID" "$EXPECTED_ARTIFACT_DIGEST" \
            "$EXPECTED_MANIFEST_SHA" "$EXPECTED_BUILD_COMMIT"
          sudo -n /usr/local/sbin/disk-arcana-deploy-broker --deploy \
            "$BUNDLE" "$EXPECTED_BUILD_COMMIT" "$(hostname)"
          sha256sum /usr/local/bin/disk-arcana-server \
            /etc/systemd/system/disk-arcana-server.service
          systemctl show disk-arcana-server \
            -p ActiveState -p UnitFileState -p Restart \
            -p StartLimitIntervalUSec -p StartLimitBurst
          curl --fail --silent --show-error --max-time 10 \
            http://127.0.0.1:9446/health
