name: Windows

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: windows-${{ matrix.target }}
    # Local Windows desktop in Tailscale mesh (vika-pc / 100.103.19.90).
    # Do NOT use GitHub-hosted windows-* - Arcanada CI runs on own runners.
    runs-on: [self-hosted, Windows, X64, vika-pc]
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      # Self-hosted desktop runners do not inherit Developer PowerShell PATH;
      # without vcvars, crates that need lib.exe fall back to missing dlltool.exe.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
      - name: Ensure dlltool on PATH (raw-dylib / windows-sys)
        shell: powershell
        run: |
          $llvm = 'C:\Program Files\LLVM\bin'
          $dll = Join-Path $llvm 'dlltool.exe'
          if (-not (Test-Path -LiteralPath $dll)) {
            throw "dlltool.exe missing under $llvm (install LLVM on the runner)"
          }
          $env:Path = "$llvm;$env:Path"
          Add-Content -Path $env:GITHUB_PATH -Value $llvm
          # llvm-dlltool has no --version; presence check is enough
          Write-Host "dlltool ready: $dll"
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659  # v1.17.0
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          target: ${{ matrix.target }}
          components: rustfmt, clippy
          # vika-pc self-hosted: rust-cache post-step hangs after all substantive
          # steps pass (DISK-0066 / INFRA-0370). Runner has warm target/ already.
          cache: false
      - name: Assert MSVC rustc host
        shell: powershell
        run: |
          rustc -vV
          $hostLine = (rustc -vV | Select-String '^host:').ToString()
          if ($hostLine -notmatch 'x86_64-pc-windows-msvc') {
            throw "Expected host x86_64-pc-windows-msvc, got: $hostLine"
          }
      - name: Install protoc
        shell: powershell
        run: |
          if (-not (Get-Command protoc -ErrorAction SilentlyContinue)) { choco install protoc -y --no-progress }
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --target ${{ matrix.target }} -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features --target ${{ matrix.target }}
      - name: Build
        run: cargo build --workspace --release --target ${{ matrix.target }}
      - name: Windows smoke (no admin)
        shell: powershell
        run: ./scripts/test-windows-smoke.ps1 -Binary target/${{ matrix.target }}/release/disk.exe
      - name: Validate WiX scaffold XML
        shell: powershell
        run: ./scripts/validate-wix-scaffold.ps1
      - name: Bundle portable zip
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          ./scripts/bundle-windows.ps1 -Binary target/${{ matrix.target }}/release/disk.exe -OutDir dist -Version ci
      - name: Upload portable bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: disk-windows-portable-${{ matrix.target }}
          path: dist/disk-arcana-windows-x86_64.zip
          retention-days: 14
