# INFRA-0370: deliver the systemd unit file to a deploy host.
#
# The release pipeline installs the server *binary* only, so a change to
# deploy/linux/disk-arcana-server.service never reached any host on its own.
# This workflow is that missing delivery step, kept separate from
# release-deploy.yml so a unit change does not require shipping a new binary.
#
# Default mode is dry-run: it prints the diff between the repo unit and the
# installed one and changes nothing. Installing is an explicit opt-in.

name: Deploy systemd unit

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        type: choice
        required: true
        default: arcana-prod
        options:
          - arcana-prod
          - arcana-prod-ci
          - arcana-devs
          # DISK-0070: the canon Datarim KB host. Its server runs as a *user*
          # unit and its share config lived only in a hand-made drop-in, so it
          # was unreachable by any delivery path — see the share-drop-in steps.
          - arcana-agents
      mode:
        description: dry-run diffs only; install writes the unit and restarts
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run
          - install
          - bootstrap-broker

permissions:
  contents: read

jobs:
  deliver:
    name: ${{ inputs.mode }} unit on ${{ inputs.target }}
    runs-on: [self-hosted, Linux, X64, "${{ inputs.target }}"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Unit contract (must hold before touching the host)
        run: bash deploy/linux/tests/test-unit-contract.sh

      # DISK-0070: arcana-agents runs the server as a *user* unit, so the
      # system-unit installer below does not apply there. Its delivery is the
      # share drop-in steps at the end of this job.
      - name: Diff repo unit against installed unit
        if: inputs.target != 'arcana-agents'
        run: bash scripts/install-systemd-unit.sh --dry-run

      - name: Report unit-delivery broker status
        run: |
          if [[ -x /usr/local/sbin/disk-arcana-install-unit ]]; then
            echo "broker=present"
          else
            echo "broker=absent (root bootstrap: deploy/linux/install-disk-arcana-install-unit-broker.sh)"
          fi

      - name: Bootstrap unit-delivery broker (root, once per host)
        if: inputs.mode == 'bootstrap-broker'
        run: |
          set -euo pipefail
          broker_sha="$(sha256sum deploy/linux/disk-arcana-install-unit-broker.sh | awk '{print $1}')"
          if [[ "$(id -u)" -eq 0 ]]; then
            bash deploy/linux/install-disk-arcana-install-unit-broker.sh "$broker_sha"
            exit 0
          fi
          if sudo -n true 2>/dev/null; then
            sudo -n bash deploy/linux/install-disk-arcana-install-unit-broker.sh "$broker_sha"
            exit 0
          fi
          printf 'bootstrap requires root on the host (see deploy/linux/install-disk-arcana-install-unit-broker.sh)\n' >&2
          exit 1

      - name: Install unit, restart, health-check, roll back on failure
        if: inputs.mode == 'install' && inputs.target != 'arcana-agents'
        run: bash scripts/install-systemd-unit.sh --install

      - name: Verify loaded restart policy
        if: inputs.mode == 'install' && inputs.target != 'arcana-agents'
        run: bash scripts/install-systemd-unit.sh --verify

      # DISK-0070: share drop-in delivery for the user-scope server on
      # arcana-agents. The contract inside the installer refuses any drop-in
      # that leaves DISK_SYNC_ROOT unwatched, so a repeat of the silent
      # non-replication cannot be shipped from here.
      - name: Share drop-in contract
        if: inputs.target == 'arcana-agents'
        run: bash deploy/linux/tests/test-user-share-dropin.sh

      # The arcana-agents runner executes as a different user than the one
      # owning the server's user unit, so `systemctl --user` here reaches the
      # runner's own bus. The installer falls back to reading the owner's unit
      # file; DISK_UNIT_OWNER names that user.
      - name: Diff share drop-in against installed copy
        if: inputs.target == 'arcana-agents'
        env:
          DISK_UNIT_OWNER: dev
        run: bash deploy/linux/install-user-share-dropin.sh

      # `--install` and `--verify` must run in the owner's own session: the
      # drop-in lives in their config tree and the restart needs their bus. The
      # installer refuses a foreign session rather than half-applying, so the
      # delivery is done through that user instead of the runner account.
      - name: Install share drop-in and restart the user unit
        if: inputs.target == 'arcana-agents' && inputs.mode == 'install'
        env:
          DISK_UNIT_OWNER: dev
        run: |
          set -euo pipefail
          if [[ "$(id -un)" == "dev" ]]; then
            bash deploy/linux/install-user-share-dropin.sh --install
            bash deploy/linux/install-user-share-dropin.sh --verify
            exit 0
          fi
          if sudo -n -u dev true 2>/dev/null; then
            sudo -n -u dev --preserve-env=DISK_UNIT_OWNER \
              bash "$PWD/deploy/linux/install-user-share-dropin.sh" --install
            sudo -n -u dev --preserve-env=DISK_UNIT_OWNER \
              bash "$PWD/deploy/linux/install-user-share-dropin.sh" --verify
            exit 0
          fi
          printf 'install must run as dev; runner user %s cannot switch to it.\n' "$(id -un)" >&2
          printf 'Either grant "sudo -n -u dev" on this host or run the two commands as dev:\n' >&2
          printf '  bash deploy/linux/install-user-share-dropin.sh --install\n' >&2
          printf '  bash deploy/linux/install-user-share-dropin.sh --verify\n' >&2
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Unit delivery — ${{ inputs.target }} (${{ inputs.mode }})"
            echo
            echo '```'
            systemctl show disk-arcana-server \
              -p StartLimitIntervalUSec -p StartLimitBurst \
              -p Restart -p RestartUSec -p NRestarts 2>/dev/null || true
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
