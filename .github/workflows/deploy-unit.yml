# INFRA-0370: deliver the systemd unit file to a deploy host.
#
# The release pipeline installs the server *binary* only, so a change to
# deploy/linux/disk-arcana-server.service never reached any host on its own.
# This workflow is that missing delivery step, kept separate from
# release-deploy.yml so a unit change does not require shipping a new binary.
#
# Default mode is dry-run: it prints the diff between the repo unit and the
# installed one and changes nothing. Installing is an explicit opt-in.

name: Deploy systemd unit

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        type: choice
        required: true
        default: arcana-prod
        options:
          - arcana-prod
          - arcana-prod-ci
          - arcana-devs
      mode:
        description: dry-run diffs only; install writes the unit and restarts
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run
          - install
          - bootstrap-broker

permissions:
  contents: read

jobs:
  deliver:
    name: ${{ inputs.mode }} unit on ${{ inputs.target }}
    runs-on: [self-hosted, Linux, X64, "${{ inputs.target }}"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Unit contract (must hold before touching the host)
        run: bash deploy/linux/tests/test-unit-contract.sh

      - name: Diff repo unit against installed unit
        run: bash scripts/install-systemd-unit.sh --dry-run

      - name: Report unit-delivery broker status
        run: |
          if [[ -x /usr/local/sbin/disk-arcana-install-unit ]]; then
            echo "broker=present"
          else
            echo "broker=absent (root bootstrap: deploy/linux/install-disk-arcana-install-unit-broker.sh)"
          fi

      - name: Bootstrap unit-delivery broker (root, once per host)
        if: inputs.mode == 'bootstrap-broker'
        run: |
          set -euo pipefail
          broker_sha="$(sha256sum deploy/linux/disk-arcana-install-unit-broker.sh | awk '{print $1}')"
          if [[ "$(id -u)" -eq 0 ]]; then
            bash deploy/linux/install-disk-arcana-install-unit-broker.sh "$broker_sha"
            exit 0
          fi
          if sudo -n true 2>/dev/null; then
            sudo -n bash deploy/linux/install-disk-arcana-install-unit-broker.sh "$broker_sha"
            exit 0
          fi
          printf 'bootstrap requires root on the host (see deploy/linux/install-disk-arcana-install-unit-broker.sh)\n' >&2
          exit 1

      - name: Install unit, restart, health-check, roll back on failure
        if: inputs.mode == 'install'
        run: bash scripts/install-systemd-unit.sh --install

      - name: Verify loaded restart policy
        if: inputs.mode == 'install'
        run: bash scripts/install-systemd-unit.sh --verify

      - name: Summary
        if: always()
        run: |
          {
            echo "### Unit delivery — ${{ inputs.target }} (${{ inputs.mode }})"
            echo
            echo '```'
            systemctl show disk-arcana-server \
              -p StartLimitIntervalUSec -p StartLimitBurst \
              -p Restart -p RestartUSec -p NRestarts 2>/dev/null || true
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
