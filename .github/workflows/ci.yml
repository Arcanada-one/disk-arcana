name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint (fmt + clippy + audit + deny)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable 2026-07-30
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - name: Ensure protoc is available
        # Self-hosted runner pool is heterogeneous — some machines lack a
        # preinstalled protoc, so a bare `protoc --version` check fails with
        # exit 127 and the whole job dies before it can compile anything
        # (disk-proto build.rs invokes protoc). Fetch a pinned prebuilt protoc
        # without root — same pattern as the gitleaks step — when it is
        # missing; no-op when protoc is already present.
        run: |
          set -euo pipefail
          if command -v protoc >/dev/null 2>&1; then
            protoc --version
            exit 0
          fi
          PROTOC_VERSION=25.3
          PROTOC_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/protoc.XXXXXX")
          curl -sSL -o "$PROTOC_DIR/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          python3 -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' \
            "$PROTOC_DIR/protoc.zip" "$PROTOC_DIR"
          chmod +x "$PROTOC_DIR/bin/protoc"
          echo "$PROTOC_DIR/bin" >> "$GITHUB_PATH"
          "$PROTOC_DIR/bin/protoc" --version
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: |
          source scripts/ci-ensure-cc.sh
          cargo clippy --all-targets --all-features -- -D warnings
      - name: Install cargo-audit + cargo-deny
        # Non-Docker install form. The previous EmbarkStudios/cargo-deny-action@v2
        # and rustsec/audit-check@v2 both ran (or the deny action built) inside a
        # Docker container; after infra-0308 rehomed CI to a non-root user the
        # self-hosted runner has no docker.sock access, so the Docker action
        # failed at "Build container for action" before any lint step ran. The
        # cargo-installed binaries run natively and honour deny.toml / the ignore
        # list below.
        run: |
          source scripts/ci-ensure-cc.sh
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked
      - name: cargo audit
        # No --ignore flags by design (DISK-0066). Suppressions live in
        # .cargo/audit.toml, which cargo-audit reads automatically from the
        # workspace root and which carries the rationale for each entry.
        # Repeating them here as flags is what let the workflow and the config
        # file drift apart: the checked-in rationale claimed quick-xml could not
        # be bumped, while a semver-compatible wayland-scanner bump fixed it.
        # Keep this step flag-free — if an advisory needs suppressing, it needs a
        # documented entry in .cargo/audit.toml, reviewed like any other change.
        run: cargo audit
      - name: cargo deny check
        # Full check (advisories + bans + licenses + sources), not licenses-only.
        # Advisory coverage here is not redundant with cargo audit: cargo-deny
        # walks the resolved feature graph while cargo-audit scans every crate in
        # Cargo.lock, so each sees advisories the other cannot. Two rules are
        # enforced only here — `unmaintained`, which cargo audit reports as a
        # warning and still exits 0 on, and `yanked`, which deny.toml sets to
        # "deny" so a yanked dependency fails the build rather than accumulating.
        run: cargo deny check
      - name: ACL direction-spoofing lint (P4a Step 10)
        run: bash crates/disk-server/lints/no_branch_on_client_config.sh .
      - name: REST loopback-bind lint (R14)
        run: bash crates/disk-client/lints/check_loopback_bind.sh .
      - name: Dev-flag prod-scope lint (DISK-0058/0059)
        run: |
          bash crates/disk-client/lints/check_dev_flags_not_in_prod.sh .
          bash crates/disk-client/lints/check_dev_flags_not_in_prod_selftest.sh
      - name: install.sh syntax (DISK-0010)
        run: sh -n scripts/install.sh
      - name: OWASP evidence paths (DISK-0012)
        run: bash scripts/validate-owasp-evidence.sh
      - name: load-test-harness.sh syntax (DISK-0012 G3)
        run: sh -n scripts/load-test-harness.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugins/obsidian/package-lock.json
      - name: Obsidian plugin unit tests (DISK-0008)
        run: |
          set -euo pipefail
          cd plugins/obsidian
          npm ci
          npm run typecheck
          npm test
      - name: gitleaks
        # Run gitleaks directly via the upstream binary — gitleaks/gitleaks-action
        # requires a paid licence for organisation accounts.
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.21.2
          GITLEAKS_BIN="${RUNNER_TEMP:-/tmp}/gitleaks-${GITLEAKS_VERSION}"
          if [ ! -x "$GITLEAKS_BIN" ]; then
            curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
              | tar -xz -C "${RUNNER_TEMP:-/tmp}" gitleaks
            mv "${RUNNER_TEMP:-/tmp}/gitleaks" "$GITLEAKS_BIN"
          fi
          "$GITLEAKS_BIN" detect --source . --no-banner --redact --verbose --config .gitleaks.toml
      - name: Immutable action-reference guard (INFRA-0370)
        # --verify-remote additionally resolves each pin through the GitHub API
        # and fails on a 40-hex SHA that is not a commit (e.g. an annotated tag
        # object), which the offline shape check cannot detect.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/check-actions-pinned.sh --verify-remote
      - name: actionlint (INFRA-0370)
        run: bash scripts/ci-ensure-actionlint.sh --run
      - name: systemd unit contract (INFRA-0370)
        run: bash deploy/linux/tests/test-unit-contract.sh
      - name: systemd unit installer (INFRA-0370)
        run: bash deploy/linux/tests/test-install-unit.sh

  test:
    name: Test (linux)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable 2026-07-30
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - name: Ensure protoc is available
        # Self-hosted runner pool is heterogeneous — some machines lack a
        # preinstalled protoc, so a bare `protoc --version` check fails with
        # exit 127 and the whole job dies before it can compile anything
        # (disk-proto build.rs invokes protoc). Fetch a pinned prebuilt protoc
        # without root — same pattern as the gitleaks step — when it is
        # missing; no-op when protoc is already present.
        run: |
          set -euo pipefail
          if command -v protoc >/dev/null 2>&1; then
            protoc --version
            exit 0
          fi
          PROTOC_VERSION=25.3
          PROTOC_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/protoc.XXXXXX")
          curl -sSL -o "$PROTOC_DIR/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          python3 -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' \
            "$PROTOC_DIR/protoc.zip" "$PROTOC_DIR"
          chmod +x "$PROTOC_DIR/bin/protoc"
          echo "$PROTOC_DIR/bin" >> "$GITHUB_PATH"
          "$PROTOC_DIR/bin/protoc" --version
      - name: Bootstrap C toolchain
        run: source scripts/ci-ensure-cc.sh
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --quiet
      - name: cargo test
        run: cargo test --workspace --all-features
      - name: Scanner load harness (1K + 10K, DISK-0012 G3)
        run: bash scripts/load-test-harness.sh all
      - name: Coverage gate (≥80 % lines, DISK-0032)
        run: |
          if [[ "${CI_LINKER_BOOTSTRAP:-native}" == "zig" ]]; then
            echo "SKIP llvm-cov: zig bootstrap cannot link __llvm_profile_runtime on this runner"
            exit 0
          fi
          cargo llvm-cov --workspace --all-features --fail-under-lines 80
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
      - name: Obsidian plugin integration (DISK-0008)
        run: bash scripts/test-obsidian-integration.sh

  fuzz-smoke:
    name: Fuzz smoke (DISK-0012, 80s)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2  # nightly 2026-07-30
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          workspaces: fuzz
      - name: Ensure protoc is available
        # The self-hosted runner pool is heterogeneous: some machines have
        # protoc pre-installed (the lint/test jobs rely on that), others do not,
        # so this nightly fuzz job can land on a protoc-less runner and fail at
        # build time (disk-core -> disk-proto build.rs invokes protoc). Mirror
        # the gitleaks step below: fetch a pinned prebuilt protoc without root
        # and put it on PATH. No-op when protoc is already present.
        run: |
          set -euo pipefail
          if command -v protoc >/dev/null 2>&1; then
            protoc --version
            exit 0
          fi
          PROTOC_VERSION=25.3
          PROTOC_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/protoc.XXXXXX")
          curl -sSL -o "$PROTOC_DIR/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          python3 -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' \
            "$PROTOC_DIR/protoc.zip" "$PROTOC_DIR"
          chmod +x "$PROTOC_DIR/bin/protoc"
          echo "$PROTOC_DIR/bin" >> "$GITHUB_PATH"
          "$PROTOC_DIR/bin/protoc" --version
      - name: Install cargo-fuzz
        run: |
          source scripts/ci-ensure-cc.sh
          cargo +nightly install cargo-fuzz --locked --quiet
      - name: cargo fuzz smoke (all targets, DISK-0012)
        working-directory: fuzz
        run: |
          set -euo pipefail
          source ../scripts/ci-ensure-cc.sh
          if [[ "${CI_LINKER_BOOTSTRAP:-native}" == "zig" ]]; then
            echo "SKIP fuzz smoke: libfuzzer ASAN link requires native g++ on this runner"
            exit 0
          fi
          for target in apply_plan path_validate proto_decode reconcile; do
            echo "==> fuzz $target (20s)"
            cargo +nightly fuzz run "$target" -- -max_total_time=20
          done

  build:
    name: Build (${{ matrix.target }})
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native build — self-hosted runners after infra-0308 lack docker.sock
          # for the non-root CI user (run 29930300677: x86_64 cross failed at
          # "permission denied" on /var/run/docker.sock).
          # Both targets native (no cross/docker): self-hosted runners lack
          # docker.sock for non-root CI user (aarch64 still failed on #114).
          - target: x86_64-unknown-linux-gnu
            build_kind: native
          - target: aarch64-unknown-linux-gnu
            build_kind: aarch64
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable 2026-07-30
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      - name: Prepare aarch64 toolchain (no docker, no sudo)
        if: matrix.build_kind == 'aarch64'
        id: aarch64_toolchain
        run: |
          set -euo pipefail
          source scripts/ci-ensure-cc.sh
          if command -v aarch64-linux-gnu-gcc >/dev/null 2>&1; then
            aarch64-linux-gnu-gcc --version | head -1
            echo "mode=gcc" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ZIG_VER=0.13.0
          ZIG_DIR="${RUNNER_TEMP}/zig-${ZIG_VER}"
          mkdir -p "$ZIG_DIR"
          curl -fsSL "https://ziglang.org/download/${ZIG_VER}/zig-linux-x86_64-${ZIG_VER}.tar.xz" \
            | tar -xJ -C "$ZIG_DIR" --strip-components=1
          echo "$ZIG_DIR" >> "$GITHUB_PATH"
          "$ZIG_DIR/zig" version
          cargo install cargo-zigbuild --locked --quiet --force
          echo "mode=zigbuild" >> "$GITHUB_OUTPUT"
      - name: Ensure protoc is available
        # Self-hosted runner pool is heterogeneous — some machines lack a
        # preinstalled protoc, so a bare `protoc --version` check fails with
        # exit 127 and the whole job dies before it can compile anything
        # (disk-proto build.rs invokes protoc). Fetch a pinned prebuilt protoc
        # without root — same pattern as the gitleaks step — when it is
        # missing; no-op when protoc is already present.
        run: |
          set -euo pipefail
          if command -v protoc >/dev/null 2>&1; then
            protoc --version
            exit 0
          fi
          PROTOC_VERSION=25.3
          PROTOC_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/protoc.XXXXXX")
          curl -sSL -o "$PROTOC_DIR/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          python3 -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' \
            "$PROTOC_DIR/protoc.zip" "$PROTOC_DIR"
          chmod +x "$PROTOC_DIR/bin/protoc"
          echo "$PROTOC_DIR/bin" >> "$GITHUB_PATH"
          "$PROTOC_DIR/bin/protoc" --version
      - name: Bootstrap C toolchain
        run: source scripts/ci-ensure-cc.sh
      - name: Build (release)
        run: |
          set -euo pipefail
          if [ "${{ matrix.build_kind }}" = "aarch64" ] && [ "${{ steps.aarch64_toolchain.outputs.mode }}" = "zigbuild" ]; then
            cargo zigbuild --release --target aarch64-unknown-linux-gnu --workspace
          else
            cargo build --release --target ${{ matrix.target }} --workspace
          fi
