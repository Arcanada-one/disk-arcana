# INFRA-0370: actionless, read-only pre-deployment runner probe.
#
# Collects host facts from a deploy target without mutating anything: no
# package installs, no unit writes, no service restarts. Every fact-gathering
# step is tolerant so the probe reports a complete picture even on a degraded
# host; a final verdict step turns the collected invariants into a pass/fail.

name: Deploy probe (read-only)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target to probe
        type: choice
        required: true
        default: arcana-prd-host
        options:
          # INFRA-0389: arcana-prod-ci remains private-only.
          # INFRA-0417: the host-unique label of arcana-prd, not the shared
          # `arcana-prod` label that once named the retired arcana-prod host.
          - arcana-prd-host
          - arcana-devs

permissions: {}

jobs:
  probe:
    name: Read-only host facts (${{ inputs.target }})
    runs-on: [self-hosted, Linux, X64, "${{ inputs.target }}"]
    steps:
      # A2-457: this job has permissions {} and no checkout, so the canonical
      # runner-broker-preflight.sh (blob 273ee95b) runs INLINE, byte-identical, before the first sudo.
      - name: Runner broker preflight (A2-457, inline canonical)
        shell: bash
        run: |
          #!/usr/bin/env bash
          # runner-broker-preflight.sh — refuse to escalate from a runner that still holds the docker group after the host
          # retired it (A2-457; the check itself is SEC-0028's, from muneral/transcribator-api scripts/ci/).
          #
          # Why a workspace copy and not the service one: the service copy is bound to `arcanada-compose-broker` and proves its
          # grant with `sudo -n <broker> <service> ps`. This repository's privileged jobs escalate through other helpers
          # (gh-triage-install.sh, kb-deploy-broker, `sudo apt-get`, `sudo systemctl`, `sudo docker`), none of which has that
          # interface. A2-457 named the gap: the docker-group check has to be separate from the broker check. So here:
          #   * the docker-group check is ALWAYS run, exactly as SEC-0028 wrote it — armed by the host marker root creates when
          #     it drops the group, so the strict check turns on at that moment and cannot be forgotten; before the marker it
          #     prints a NOTE and passes;
          #   * a broker is checked ONLY when a job names one (BROKER_PREFLIGHT_BIN): installed, not a symlink, not writable by
          #     this account (the test that holds under an ACL), root-owned, mode 755. No service action is called — brokers
          #     here do not share an interface, and a job that needs one proves its own grant.
          set -euo pipefail

          fail() {
            printf 'runner-broker-preflight: ERROR: %s\n' "$1" >&2
            exit 1
          }

          marker="${BROKER_PREFLIGHT_RETIRED_MARKER:-/etc/arcanada/docker-group-retired}"
          forbidden_group="${BROKER_PREFLIGHT_FORBIDDEN_GROUP:-docker}"
          broker="${BROKER_PREFLIGHT_BIN:-}"

          if [[ -n "${broker}" ]]; then
            [[ -f "${broker}" ]] || fail "broker is not installed at ${broker}"
            [[ ! -L "${broker}" ]] || fail "broker path is a symlink"
            [[ -x "${broker}" ]] || fail "broker is not executable"
            [[ ! -w "${broker}" ]] || fail "broker is writable by this account"
            owner="$(stat -c '%U' -- "${broker}")"
            [[ "${owner}" == 'root' ]] || fail "broker is owned by ${owner}, not root"
            mode="$(stat -c '%a' -- "${broker}")"
            [[ "${mode}" == '755' ]] || fail "broker mode is ${mode}, expected 755"
          fi

          if [[ "${BROKER_PREFLIGHT_TEST_MODE:-0}" == "1" ]]; then
            effective_groups="${BROKER_PREFLIGHT_EFFECTIVE_GROUPS:-}"
          else
            effective_groups="$(id -nG)"
          fi

          if [[ -e "${marker}" ]]; then
            case " ${effective_groups} " in
              *" ${forbidden_group} "*)
                fail "runner is still in the ${forbidden_group} group after it was retired on this host"
                ;;
            esac
          else
            printf 'runner-broker-preflight: NOTE: %s absent — %s group membership not yet retired on this host\n' \
              "${marker}" "${forbidden_group}"
          fi

          printf 'runner-broker-preflight: group state%s checks passed\n' "${broker:+ and broker install}"

      - name: Host identity
        run: |
          hostname
          uname -r
          uname -m

      - name: Effective user and groups
        run: |
          id -u
          id -un
          id -Gn

      - name: Staging isolation capabilities
        id: isolation
        run: |
          bool_command() {
            if "$@" >/dev/null 2>&1; then printf true; else printf false; fi
          }

          subid_count() {
            local count file="$1"
            if count="$(awk -F: -v user="$(id -un)" '
                $1 == user && $2 ~ /^[0-9]+$/ && $3 ~ /^[0-9]+$/ {total += $3}
                END {print total + 0}
              ' "$file" 2>/dev/null)"; then
              printf '%s' "$count"
            else
              printf unknown
            fi
          }

          rootless_userns=false
          if command -v unshare >/dev/null 2>&1; then
            rootless_userns="$(bool_command unshare --user --map-root-user true)"
          fi
          subuid_count="$(subid_count /etc/subuid)"
          subgid_count="$(subid_count /etc/subgid)"
          subuid_ready=false
          subgid_ready=false
          if [[ "$subuid_count" =~ ^[0-9]+$ ]] && (( subuid_count >= 65536 )); then
            subuid_ready=true
          fi
          if [[ "$subgid_count" =~ ^[0-9]+$ ]] && (( subgid_count >= 65536 )); then
            subgid_ready=true
          fi
          user_systemd="$(bool_command systemctl --user show-environment)"
          linger="$(loginctl show-user "$(id -u)" -p Linger --value 2>/dev/null || printf unknown)"
          podman="$(bool_command command -v podman)"
          docker="$(bool_command command -v docker)"
          docker_socket_writable="$(bool_command test -w /var/run/docker.sock)"
          runner_services=unknown
          if measured_runner_services="$(systemctl list-units --type=service --all 'actions.runner.*' \
              --no-legend --no-pager 2>/dev/null | awk 'END {print NR + 0}')"; then
            runner_services="$measured_runner_services"
          fi

          {
            echo "rootless_userns=$rootless_userns"
            echo "subuid_count=$subuid_count"
            echo "subgid_count=$subgid_count"
            echo "subuid_ready=$subuid_ready"
            echo "subgid_ready=$subgid_ready"
            echo "user_systemd=$user_systemd"
            echo "linger=$linger"
            echo "podman=$podman"
            echo "docker=$docker"
            echo "docker_socket_writable=$docker_socket_writable"
            echo "runner_services=$runner_services"
          } >>"$GITHUB_OUTPUT"
          printf 'rootless_userns=%s subuid_count=%s subgid_count=%s subuid_ready=%s subgid_ready=%s user_systemd=%s linger=%s podman=%s docker=%s docker_socket_writable=%s runner_services=%s\n' \
            "$rootless_userns" "$subuid_count" "$subgid_count" "$subuid_ready" "$subgid_ready" "$user_systemd" "$linger" \
            "$podman" "$docker" "$docker_socket_writable" "$runner_services"

      - name: systemd version
        run: systemd-analyze --version | head -1

      - name: Unit file existence and digest
        id: unit
        run: |
          unit=/etc/systemd/system/disk-arcana-server.service
          if [[ -f "$unit" ]]; then
            echo "exists=true" >>"$GITHUB_OUTPUT"
            sha256sum "$unit"
          else
            echo "exists=false" >>"$GITHUB_OUTPUT"
            echo "unit file absent: $unit"
          fi

      - name: Service state
        id: state
        run: |
          active="$(systemctl is-active disk-arcana-server 2>/dev/null || true)"
          enabled="$(systemctl is-enabled disk-arcana-server 2>/dev/null || true)"
          unit_file_state="$(systemctl show disk-arcana-server -p UnitFileState --value 2>/dev/null || true)"
          {
            echo "active=$active"
            echo "enabled=$enabled"
            echo "unit_file_state=$unit_file_state"
          } >>"$GITHUB_OUTPUT"
          printf 'is-active=%s is-enabled=%s UnitFileState=%s\n' \
            "$active" "$enabled" "$unit_file_state"

      - name: Loaded restart policy
        id: policy
        run: |
          # systemd reports the parsed values regardless of which section the
          # directives were written in, so this is the ground truth for whether
          # the [Unit]-section placement actually took effect.
          systemctl show disk-arcana-server \
            -p StartLimitIntervalUSec \
            -p StartLimitBurst \
            -p Restart \
            -p RestartUSec 2>/dev/null | tee /tmp/disk-arcana-policy.txt || true
          interval="$(sed -n 's/^StartLimitIntervalUSec=//p' /tmp/disk-arcana-policy.txt)"
          burst="$(sed -n 's/^StartLimitBurst=//p' /tmp/disk-arcana-policy.txt)"
          echo "interval=$interval" >>"$GITHUB_OUTPUT"
          echo "burst=$burst" >>"$GITHUB_OUTPUT"

      - name: Health endpoint
        id: health
        run: |
          if curl --fail --silent --show-error --max-time 10 \
              http://127.0.0.1:9446/health; then
            echo
            echo "ok=true" >>"$GITHUB_OUTPUT"
          else
            echo "ok=false" >>"$GITHUB_OUTPUT"
            echo "health endpoint unreachable on 127.0.0.1:9446"
          fi

      - name: Non-interactive sudo surface
        run: sudo -ln 2>/dev/null || echo "no non-interactive sudo"

      - name: Verdict
        run: |
          {
            echo "### Deploy probe — ${{ inputs.target }}"
            echo
            echo "| fact | value |"
            echo "| --- | --- |"
            echo "| unit file present | ${{ steps.unit.outputs.exists }} |"
            echo "| is-active | ${{ steps.state.outputs.active }} |"
            echo "| is-enabled | ${{ steps.state.outputs.enabled }} |"
            echo "| UnitFileState | ${{ steps.state.outputs.unit_file_state }} |"
            echo "| StartLimitIntervalUSec | ${{ steps.policy.outputs.interval }} |"
            echo "| StartLimitBurst | ${{ steps.policy.outputs.burst }} |"
            echo "| health 9446 | ${{ steps.health.outputs.ok }} |"
            echo "| rootless user namespace | ${{ steps.isolation.outputs.rootless_userns }} |"
            echo "| subordinate uid/gid count | ${{ steps.isolation.outputs.subuid_count }}/${{ steps.isolation.outputs.subgid_count }} |"
            echo "| subordinate uid/gid ready | ${{ steps.isolation.outputs.subuid_ready }}/${{ steps.isolation.outputs.subgid_ready }} |"
            echo "| user systemd / linger | ${{ steps.isolation.outputs.user_systemd }}/${{ steps.isolation.outputs.linger }} |"
            echo "| podman / docker | ${{ steps.isolation.outputs.podman }}/${{ steps.isolation.outputs.docker }} |"
            echo "| writable Docker socket | ${{ steps.isolation.outputs.docker_socket_writable }} |"
            echo "| actions runner services | ${{ steps.isolation.outputs.runner_services }} |"
          } >>"$GITHUB_STEP_SUMMARY"

          fail=0
          [[ "${{ steps.unit.outputs.exists }}" == "true" ]] || { echo "FAIL unit file absent"; fail=1; }
          [[ "${{ steps.state.outputs.active }}" == "active" ]] || { echo "FAIL service not active"; fail=1; }
          [[ "${{ steps.state.outputs.unit_file_state }}" == "enabled" ]] || { echo "FAIL UnitFileState is not exactly enabled"; fail=1; }
          [[ "${{ steps.health.outputs.ok }}" == "true" ]] || { echo "FAIL health endpoint down"; fail=1; }
          # 120s expressed in microseconds; proves the [Unit] placement parsed.
          [[ "${{ steps.policy.outputs.interval }}" == "2min" ]] || echo "WARN StartLimitIntervalUSec=${{ steps.policy.outputs.interval }} (expected 2min)"
          [[ "${{ steps.policy.outputs.burst }}" == "5" ]] || echo "WARN StartLimitBurst=${{ steps.policy.outputs.burst }} (expected 5)"
          exit "$fail"
