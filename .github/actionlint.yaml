self-hosted-runner:
  # Custom labels for the org-level self-hosted runners used by deploy jobs.
  # Declared here so actionlint does not flag them as unknown runner labels.
  # Keep this list in sync with the registered runners of the Arcanada-one org
  # (`gh api orgs/Arcanada-one/actions/runners`). The dev pool is
  # `arcana-devs`/`dev`; retaining a dead label here would let actionlint accept
  # a workflow that GitHub Actions can never schedule.
  labels:
    - Linux
    - X64
    - arcana-devs
    - arcana-prod
    - arcana-prod-ci
    - dev
    - vika-pc
