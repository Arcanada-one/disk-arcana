self-hosted-runner:
  # Custom labels for the org-level self-hosted runners used by deploy jobs.
  # Declared here so actionlint does not flag them as unknown runner labels.
  # Keep this list in sync with the registered runners of the Arcanada-one org
  # (`gh api orgs/Arcanada-one/actions/runners`). The two Disk deploy labels
  # are intentionally unique to their dedicated non-root runner identities;
  # live label readback remains a pre-merge/deploy gate.
  labels:
    - Linux
    - X64
    - arcana-agents
    - arcana-devs
    - arcana-prod
    - arcana-prod-ci
    - disk-arcana-stage
    - disk-arcana-prod
    - dev
    # `cross` builds need BOTH Docker access and a host C toolchain, because
    # `cargo install cross` compiles on the host. Three runners carry `docker`
    # and only ci-general has `cc`, so the cross jobs pin `ci-general` rather
    # than `docker` — see the note on the `build` job in release-deploy.yml.
    - ci-general
    - docker
    - vika-pc
