# cross-rs configuration. Adds a modern `protoc` to the cross Docker images
# so tonic-build can run inside the container — the default cross images ship
# Ubuntu/Debian releases whose `protobuf-compiler` package predates proto3.
# Source: https://github.com/cross-rs/cross/wiki/Configuration
#
# HOST-arch protoc (linux-x86_64) for ALL targets: build scripts (build.rs /
# tonic-build) execute on the cross container's host userspace (x86_64 when
# cross-compiling aarch64 from an x86_64 runner). Installing target-arch
# protoc (linux-aarch_64) makes the shell try to interpret the ELF as a script
# → "Syntax error: \"(\" unexpected" (CI Build aarch64, run 29930300677).

[build]
pre-build = [
    "apt-get update && apt-get install --assume-yes --no-install-recommends curl unzip ca-certificates",
    "curl -sSLO https://github.com/protocolbuffers/protobuf/releases/download/v25.3/protoc-25.3-linux-x86_64.zip",
    "unzip -o protoc-25.3-linux-x86_64.zip -d /usr/local",
    "rm -f protoc-25.3-linux-x86_64.zip",
]

# Public manifest digests read anonymously from GHCR on 2026-11-22.
# Pinning these images avoids mutable tag resolution and the historical
# unauthenticated pull failure for the x86_64 build image.
[target.x86_64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-gnu@sha256:9e5b39c09874bc1816c675ed11afca2c2ed6cee0c4ed2b3c1d5763c346c9ae3f"

[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu@sha256:7f8308a8734d9fcd2ebbe9a3e4bdea74af293f0799d80c3cc341e340cda49a4c"
